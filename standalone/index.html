<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Codex 原版用量仪表</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101419;color:#ced3d8;font:12px 'Microsoft YaHei UI',sans-serif;overflow:hidden}
#drag{position:absolute;top:0;left:0;right:0;height:34px;-webkit-app-region:drag;z-index:100000}
#info{position:absolute;left:20px;bottom:8px;line-height:1.6;color:#ccd1d6;z-index:200000} #label{position:absolute;left:20px;top:12px;color:#aeb5bc;font-size:11px;z-index:200000}
.g-cur{display:none!important} #dsh-corner-gauge{cursor:grab;zoom:1.15} #status{color:#e68d78}
#dsh-corner-gauge .g-menu{position:fixed!important;top:8px!important;right:10px!important;bottom:auto!important;box-sizing:border-box;max-height:calc(86vh - 20px);overflow-y:auto;overscroll-behavior:contain}
</style></head><body><div id="drag"></div>
<div id="label">CODEX · 短周期剩余 %</div><div id="info"><div id="details">正在读取套餐用量…</div><div id="status"></div></div>
<script>
window.__DSH_BADGE_CONFIG__={position:{right:14,bottom:54},pollMs:60000};
let cached=null;
function stamp(n){return n?new Date(n*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'未知'}
async function getQuota(){let response=await fetch('/quota',{cache:'no-store'});if(!response.ok)throw Error('用量读取失败');return await response.json()}
window.__ModuleLoader__={load(def){let module=def.factory(()=>{throw Error('unexpected dependency')});module.apply({remote:{account:{async getBalance(){try{cached=await getQuota();let a=cached.primary||{},b=cached.secondary||{};document.getElementById('details').textContent=`短周期 ${stamp(a.resetsAt)} 重置 · 周周期剩余 ${b.usedPercent==null?'--':(100-b.usedPercent)+'%'}，${stamp(b.resetsAt)} 重置`;document.getElementById('status').textContent='';return {ok:true,value:{status:'ready',value:[{currency:'CNY',balance:String(Math.max(0,100-a.usedPercent))}],bonusWallets:[]}}}catch(e){document.getElementById('status').textContent='暂时无法读取用量';throw e}}}},effect(){}})}};
</script><script src="/client.js"></script></body></html>
