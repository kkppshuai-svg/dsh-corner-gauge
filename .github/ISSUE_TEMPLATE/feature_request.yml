name: 功能建议
description: 新皮肤、新面板元素、新配置项
title: '[Feature] '
labels: ['enhancement']
body:
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新边框模板（skin）
        - 新面板元素（element）
        - 新配置项
        - 其他
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它长什么样 / 怎么用
    validations:
      required: true

  - type: textarea
    id: sketch
    attributes:
      label: 参考图或草图
      description: 有截图最好，直接拖进来

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
