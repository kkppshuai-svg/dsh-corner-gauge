name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack installable archive
        run: |
          mkdir -p dist
          cp -r lib cordis.patch.yml package.json README.md LICENSE dist/
          cd dist && zip -r ../dsh-corner-gauge-${{ github.ref_name }}.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dsh-corner-gauge-${{ github.ref_name }}.zip
            lib/client.js
