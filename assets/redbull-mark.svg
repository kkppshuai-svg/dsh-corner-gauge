<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70" width="200" height="70">
  <!-- 红牛字标：黄底 + 白字，近似罐身配色 -->
  <defs>
    <linearGradient id="rb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd400"/>
      <stop offset="1" stop-color="#e8a800"/>
    </linearGradient>
  </defs>
  <text x="100" y="50" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-style="italic" font-weight="800"
        font-size="44" letter-spacing="1" fill="url(#rb)">RED BULL</text>
</svg>
